<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Gamer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300C853'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial Black' font-size='18' font-weight='900' fill='%23FFD600'%3EAG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/persona5.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="app">
        <div id="splash-screen" class="splash-screen">
            <div class="splash-content">
                <div class="splash-logo">
                    <div class="splash-icon">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="brGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00C853"/>
                                    <stop offset="50%" style="stop-color:#FFD600"/>
                                    <stop offset="100%" style="stop-color:#002776"/>
                                </linearGradient>
                            </defs>
                            <rect x="5" y="20" width="90" height="60" rx="12" fill="none" stroke="url(#brGrad)" stroke-width="4"/>
                            <circle cx="30" cy="50" r="8" fill="#00C853"/>
                            <circle cx="30" cy="50" r="4" fill="#FFD600"/>
                            <rect x="55" y="38" width="8" height="8" rx="2" fill="#FFD600"/>
                            <rect x="67" y="38" width="8" height="8" rx="2" fill="#00C853"/>
                            <rect x="55" y="52" width="8" height="8" rx="2" fill="#002776"/>
                            <rect x="67" y="52" width="8" height="8" rx="2" fill="#FFD600"/>
                            <circle cx="15" cy="38" r="3" fill="#FFD600" opacity="0.6"/>
                            <circle cx="15" cy="62" r="3" fill="#00C853" opacity="0.6"/>
                        </svg>
                    </div>
                    <h1 class="splash-title">ACERVO<br><span>GAMER</span></h1>
                </div>
                <div class="splash-loader">
                    <div class="splash-bar"></div>
                </div>
                <p class="splash-text">Carregando...</p>
            </div>
        </div>

        <canvas id="particles-canvas" class="particles-canvas"></canvas>

        <header id="main-header" class="main-header hidden">
            <div class="header-inner">
                <div class="logo-area" data-navigate="#/">
                    <div class="logo-icon-mini">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="brGradMini" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00C853"/>
                                    <stop offset="50%" style="stop-color:#FFD600"/>
                                    <stop offset="100%" style="stop-color:#2979FF"/>
                                </linearGradient>
                            </defs>
                            <rect x="5" y="20" width="90" height="60" rx="12" fill="none" stroke="url(#brGradMini)" stroke-width="4"/>
                            <circle cx="30" cy="50" r="8" fill="#00C853"/>
                            <circle cx="30" cy="50" r="4" fill="#FFD600"/>
                            <rect x="55" y="38" width="8" height="8" rx="2" fill="#FFD600"/>
                            <rect x="67" y="38" width="8" height="8" rx="2" fill="#00C853"/>
                            <rect x="55" y="52" width="8" height="8" rx="2" fill="#002776"/>
                            <rect x="67" y="52" width="8" height="8" rx="2" fill="#FFD600"/>
                        </svg>
                    </div>
                    <span class="logo-text-mini">ACERVO GAMER</span>
                </div>
                <nav class="main-nav">
                    <a href="#/" class="nav-link active" data-route="/">
                        <span class="nav-link-text">INICIO</span>
                    </a>
                    <a href="#/jogos" class="nav-link" data-route="/jogos">
                        <span class="nav-link-text">JOGOS</span>
                    </a>
                    <a href="#/comunidade" class="nav-link" data-route="/comunidade">
                        <span class="nav-link-text">COMUNIDADE</span>
                    </a>
                    <a href="#/sobre" class="nav-link" data-route="/sobre">
                        <span class="nav-link-text">SOBRE</span>
                    </a>
                </nav>
                <div class="header-actions">
                    <button id="auth-btn" class="p5-btn p5-btn-small" data-navigate="#/auth">
                        <span>ENTRAR</span>
                    </button>
                    <div id="user-menu" class="user-menu hidden">
                        <button class="user-avatar-btn" id="user-avatar-btn">
                            <div class="user-avatar-mini" id="header-avatar"></div>
                        </button>
                        <div class="user-dropdown hidden" id="user-dropdown">
                            <div class="dropdown-header">
                                <div class="dropdown-avatar" id="dropdown-avatar"></div>
                                <div class="dropdown-info">
                                    <span class="dropdown-name" id="dropdown-name"></span>
                                    <span class="dropdown-email" id="dropdown-email"></span>
                                </div>
                            </div>
                            <div class="dropdown-divider"></div>
                            <a href="#/comunidade/perfil" class="dropdown-item" data-navigate="#/comunidade/perfil">
                                <span class="dropdown-icon">👤</span>Meu Perfil
                            </a>
                            <button class="dropdown-item" id="logout-btn">
                                <span class="dropdown-icon">🚪</span>Sair
                            </button>
                        </div>
                    </div>
                </div>
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </header>

        <main id="main-content" class="main-content hidden">
            <div id="page-container" class="page-container"></div>
        </main>

        <div id="audio-player" class="audio-player">
            <div class="audio-player-inner">
                <div class="audio-info">
                    <div class="audio-thumb" id="audio-thumb"></div>
                    <div class="audio-text">
                        <span class="audio-title" id="audio-title">Nenhuma música selecionada</span>
                        <span class="audio-artist" id="audio-artist"></span>
                    </div>
                </div>
                <div class="audio-controls">
                    <button class="audio-btn" id="audio-prev">⏮</button>
                    <button class="audio-btn audio-btn-play" id="audio-play">▶</button>
                    <button class="audio-btn" id="audio-next">⏭</button>
                </div>
                <div class="audio-progress-area">
                    <div class="audio-progress-bar" id="audio-progress-bar">
                        <div class="audio-progress-fill" id="audio-progress-fill"></div>
                        <div class="audio-progress-thumb" id="audio-progress-thumb"></div>
                    </div>
                    <div class="audio-time">
                        <span id="audio-current-time">0:00</span>
                        <span id="audio-duration">0:00</span>
                    </div>
                </div>
                <div class="audio-volume">
                    <button class="audio-btn" id="audio-mute">🔊</button>
                    <input type="range" id="audio-volume-slider" min="0" max="100" value="70" class="volume-slider">
                </div>
                <button class="audio-btn audio-close" id="audio-close">✕</button>
            </div>
        </div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-content" id="modal-content"></div>
        </div>

        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/router.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/games.js"></script>
    <script src="js/community.js"></script>
    <script src="js/comments.js"></script>
    <script src="js/audio-player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
