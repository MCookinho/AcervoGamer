name: Download Soundtracks

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      game:
        description: 'Game slug to download (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          pip install --break-system-packages yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify installations
        run: |
          yt-dlp --version
          ffmpeg -version | head -1
          node --version
          echo "PATH=$PATH"

      - name: Download songs
        run: |
          if [ -n "${{ github.event.inputs.game }}" ]; then
            node scripts/download-songs.js --game "${{ github.event.inputs.game }}"
          else
            node scripts/download-songs.js
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/games/*/*.json" "data/games/Songs/"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "chore: download soundtracks e atualizar audioUrl [skip ci]"
            git push
          fi
